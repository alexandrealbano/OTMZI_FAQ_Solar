site_name: Central de Ajuda - OTMZI Solar
theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    # Configuração para o modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue        # Muda o topo amarelo para Azul
      accent: blue        # Cor dos links e detalhes
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo escuro

    # Configuração para o modo escuro (mantém o visual confortável à noite)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Mudar para modo claro

  features:
    - search.suggest
    - search.highlight
    - navigation.tabs      # Se seu menu crescer, ele cria abas bonitas no topo